name: Uses Examples
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installing Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.13'
      - name: run a python command
        run: python my_script.py
